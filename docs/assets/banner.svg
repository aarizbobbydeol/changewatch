<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b1020"/>
      <stop offset="100%" stop-color="#151b33"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#22c55e"/>
      <stop offset="55%" stop-color="#22c55e"/>
      <stop offset="70%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#ef4444"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity="0.04"/>
    </pattern>
  </defs>

  <rect width="1200" height="320" rx="18" fill="url(#bg)"/>
  <rect width="1200" height="320" rx="18" fill="url(#grid)"/>

  <!-- Title -->
  <g transform="translate(64,112)">
    <circle cx="14" cy="-14" r="14" fill="none" stroke="#38bdf8" stroke-width="3"/>
    <circle cx="14" cy="-14" r="4" fill="#38bdf8"/>
    <text x="44" y="0" font-size="44" font-weight="700" fill="#f8fafc">ChangeWatch</text>
    <text x="0" y="44" font-size="20" fill="#94a3b8">Know within 10 minutes if your last deploy broke prod.</text>
    <text x="0" y="74" font-size="16" fill="#64748b">Self-hosted · Deterministic release verdicts · AI root cause · Slack alerts</text>
  </g>

  <!-- Error-rate timeline -->
  <g transform="translate(640,60)">
    <rect x="0" y="0" width="500" height="200" rx="12" fill="#0f172a" stroke="#1e293b"/>
    <text x="20" y="28" font-size="13" fill="#64748b">error rate · release a644d37</text>

    <line x1="270" y1="42" x2="270" y2="180" stroke="#38bdf8" stroke-dasharray="4 4"/>
    <rect x="232" y="44" width="76" height="20" rx="10" fill="#0c4a6e"/>
    <text x="270" y="58" font-size="11" fill="#7dd3fc" text-anchor="middle">deploy</text>

    <polyline fill="none" stroke="url(#line)" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"
      points="20,162 60,160 100,164 140,158 180,161 220,159 260,162 290,150 320,128 350,110 380,96 420,88 460,84 480,82"/>

    <g transform="translate(340,150)">
      <rect width="140" height="30" rx="15" fill="#7f1d1d" stroke="#ef4444"/>
      <circle cx="18" cy="15" r="5" fill="#ef4444"/>
      <text x="32" y="20" font-size="13" font-weight="700" fill="#fecaca">ROLLBACK</text>
    </g>
    <text x="20" y="194" font-size="11" fill="#475569">-30m</text>
    <text x="300" y="194" font-size="11" fill="#475569">+10m checkpoint</text>
    <text x="440" y="194" font-size="11" fill="#475569">+30m</text>
  </g>
</svg>
