# Use the published images instead of building locally:
#   docker compose -f docker-compose.yml -f docker-compose.release.yml pull
#   docker compose -f docker-compose.yml -f docker-compose.release.yml up -d --no-build
# Pin a version with CHANGEWATCH_VERSION=1.0.1 in .env (default: latest).
x-server-image: &server-image ghcr.io/aarizbobbydeol/changewatch-server:${CHANGEWATCH_VERSION:-latest}

services:
  api:
    image: *server-image
  worker:
    image: *server-image
  detector:
    image: *server-image
  investigator:
    image: *server-image
  notifier:
    image: *server-image
  demo:
    image: *server-image
  dashboard:
    image: ghcr.io/aarizbobbydeol/changewatch-dashboard:${CHANGEWATCH_VERSION:-latest}
