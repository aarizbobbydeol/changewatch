[build-system]
requires = ["setuptools>=77.0"]
build-backend = "setuptools.build_meta"

[project]
name = "changewatch"
version = "1.0.0"
description = "ChangeWatch Python SDK for error and performance monitoring"
readme = "README.md"
# SPDX license expression (PEP 639); the license text ships in the package as required
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.9"
dependencies = []

[tool.setuptools]
# Only the SDK itself: without this, setuptools also finds bench/ and refuses to build
packages = ["changewatch"]
