name: Release

# Push a version tag (git tag v1.0.1 && git push origin v1.0.1) to publish images and a release.
# Before tagging, set the new version in sdk/pyproject.toml and scripts/install.sh (CI checks they match).
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  ci:
    name: Full CI must pass first
    uses: ./.github/workflows/ci.yml

  images:
    name: Publish ${{ matrix.image }} image
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - image: server
            dockerfile: server/Dockerfile
          - image: dashboard
            dockerfile: dashboard/Dockerfile
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up QEMU (arm64 builds)
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image names and tags
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/changewatch-${{ matrix.image }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Dashboard only: the /api and /v1 proxy target is fixed at build time
          build-args: API_URL=http://api:8000
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

  installer:
    name: Install the published release the way users do
    needs: images
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: One-command install from the images just published (no build)
        run: ./scripts/install.sh --yes --project smoke | tee "$RUNNER_TEMP/install.log"

      - name: It answers, with the version that was tagged
        run: |
          set -e
          curl -fsS --retry 15 --retry-delay 2 --retry-all-errors http://localhost:8000/healthz
          curl -fsS --retry 15 --retry-delay 2 --retry-all-errors -o /dev/null http://localhost:3000/
          grep -E "^Ingest Key: +cw_ingest_" "$RUNNER_TEMP/install.log"
          grep -x "CHANGEWATCH_VERSION=${GITHUB_REF_NAME#v}" .env
          docker compose images | grep -E "changewatch-(server|dashboard) +${GITHUB_REF_NAME#v} "

      - name: Service logs (on failure)
        if: failure()
        run: docker compose logs --no-color --tail=200

      - name: Stop
        if: always()
        run: docker compose down -v

  release:
    name: GitHub Release
    needs: [images, installer]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Create the release with its CHANGELOG.md section as the notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" '/^## / { p = ($2 == v); next } p' CHANGELOG.md > "$RUNNER_TEMP/notes.md"
          printf '\n**Images:** `ghcr.io/%s/changewatch-server:%s` and `ghcr.io/%s/changewatch-dashboard:%s`. **SDK:** `pip install changewatcher==%s`.\n' \
            "${{ github.repository_owner }}" "$version" "${{ github.repository_owner }}" "$version" "$version" >> "$RUNNER_TEMP/notes.md"
          if [ "$(wc -l < "$RUNNER_TEMP/notes.md")" -lt 3 ]; then
            gh release create "$GITHUB_REF_NAME" --repo "${{ github.repository }}" --title "ChangeWatch $GITHUB_REF_NAME" --generate-notes
          else
            gh release create "$GITHUB_REF_NAME" --repo "${{ github.repository }}" --title "ChangeWatch $GITHUB_REF_NAME" --notes-file "$RUNNER_TEMP/notes.md"
          fi
