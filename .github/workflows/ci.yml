name: ChangeWatch CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    name: Tests & Safety Verification
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: changewatch
          POSTGRES_PASSWORD: changewatch
          POSTGRES_DB: changewatch
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r server/requirements.txt -r sdk/requirements.txt

      - name: Run Pytest Test Suite
        env:
          DATABASE_URL: postgresql://changewatch:changewatch@localhost:5432/changewatch
          REDIS_URL: redis://localhost:6379/0
          SECRET_KEY: test_secret_key_32_bytes_long_1234
          ENCRYPTION_MASTER_KEY: eHh4eHh4eHh4eHh4eHh4eHh4eHh4eHh4eHh4eHh4eHg=
          LLM_PROVIDER: fake
          DECISION_PROVIDER: rules
          TELEMETRY_ENABLED: 0
        run: |
          pytest server/tests sdk/tests

      - name: Run AI SRE & Decisions Evals Benchmark
        run: |
          python -m evals.run --provider fake

      - name: Run Security & Read-Only AST Compliance Checks
        run: |
          python scripts/security_check.py

      - name: Run Chaos Test Suite
        run: |
          python scripts/chaos.py
