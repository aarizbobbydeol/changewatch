# ==============================================================================
# ChangeWatch deploy hook: a complete example workflow
# ==============================================================================
# Copy to .github/workflows/ in your repository and put your own deploy step where
# marked. ChangeWatch only reads the checkout:
# 1. READ-ONLY: 'permissions: contents: read' and 'persist-credentials: false'.
#    ChangeWatch never commits, pushes or changes your repository.
# 2. NON-BLOCKING: the ChangeWatch step has 'continue-on-error: true'; an outage
#    never fails your deploy. Its one request times out after 10 seconds.
# 3. SECRET FILES NEVER SENT: .env*, *.pem, *.key, id_rsa*, secrets/** and the
#    'exclude' globs (default infra/**) are left out of the diff and file list.
# The logic lives in action/notify.py (standard-library Python, no curl).
# ==============================================================================

name: Deploy

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2            # the parent commit, to diff against
          persist-credentials: false

      # - name: Deploy
      #   run: ./deploy.sh          # your deploy step

      - name: Tell ChangeWatch about the deploy
        continue-on-error: true
        uses: aarizbobbydeol/changewatch/action@main
        with:
          changewatch_url: ${{ secrets.CHANGEWATCH_URL }}         # your server, e.g. https://changewatch.example.com
          changewatch_api_key: ${{ secrets.CHANGEWATCH_API_KEY }} # the project's cw_ingest_ key
          environment: prod
          mode: minimal              # 'full' also sends the changed files (scrubbed, encrypted)
          exclude: "infra/**"
