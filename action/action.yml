name: "ChangeWatch Deployment Hook"
description: "Tells ChangeWatch about a deploy (commit, diff, changed lines, CODEOWNERS). Read-only: it never writes to your repository."
author: "ChangeWatch"

inputs:
  changewatch_url:
    description: "ChangeWatch server URL, for example https://changewatch.yourdomain.com"
    required: true
  changewatch_api_key:
    description: "Project ingest key (cw_ingest_...). Store it as a repository secret."
    required: true
  environment:
    description: "Deployment environment (e.g. prod, staging)"
    required: false
    default: "prod"
  mode:
    description: "'minimal': diff, changed paths and line ranges. 'full': also the changed files' contents (shown next to an alert; scrubbed and encrypted on the server)."
    required: false
    default: "minimal"
  exclude:
    description: "Comma-separated globs never sent (added to **/.env*, **/*.pem, **/*.key, **/id_rsa*, secrets/**)"
    required: false
    default: "infra/**"

runs:
  using: "composite"
  steps:
    - name: Notify ChangeWatch
      shell: bash
      # A ChangeWatch outage must never fail your deploy
      continue-on-error: true
      # Inputs go through the environment, never pasted into the script
      env:
        CW_URL: ${{ inputs.changewatch_url }}
        CW_KEY: ${{ inputs.changewatch_api_key }}
        CW_ENV: ${{ inputs.environment }}
        CW_MODE: ${{ inputs.mode }}
        CW_EXCLUDE: ${{ inputs.exclude }}
        CW_SHA: ${{ github.sha }}
        CW_BEFORE: ${{ github.event.before }}
      run: python3 "${{ github.action_path }}/notify.py"
